<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo marfil suave -->
  <rect width="512" height="512" fill="#F7F5ED" />

  <!-- Círculo incompleto de trazo fino (#71899D) envolviendo la composición -->
  <!-- Centro (256, 256), radio 152. Abertura limpia en la parte superior derecha por donde emerge la pluma -->
  <path
    d="M 366 151 A 152 152 0 1 1 232 106"
    fill="none"
    stroke="#71899D"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Libro abierto en la parte inferior (capas secundarias elevadas en #71899D) -->
  <path
    d="M 256 344 C 228 310, 178 304, 138 318"
    fill="none"
    stroke="#71899D"
    stroke-width="6.5"
    stroke-linecap="round"
  />
  <path
    d="M 256 344 C 284 310, 334 304, 374 318"
    fill="none"
    stroke="#71899D"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <!-- Lomo / base inferior sutil del libro (#71899D) -->
  <path
    d="M 106 382 C 164 388, 214 398, 256 398 C 298 398, 348 388, 406 382"
    fill="none"
    stroke="#71899D"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <!-- Libro abierto: páginas principales simétricas (#203B5B con relleno #F7F5ED) -->
  <path
    d="M 256 354 C 224 328, 172 326, 122 342 L 114 368 C 166 360, 218 364, 256 382 Z"
    fill="#F7F5ED"
    stroke="#203B5B"
    stroke-width="9"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <path
    d="M 256 354 C 288 328, 340 326, 390 342 L 398 368 C 346 360, 294 364, 256 382 Z"
    fill="#F7F5ED"
    stroke="#203B5B"
    stroke-width="9"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Pluma estilográfica clásica protagonista emergiendo del centro, inclinada ligeramente a la derecha -->
  <g transform="rotate(14 256 352)">
    <!-- Halo plano marfil para separación limpia respecto al libro y el círculo -->
    <path
      d="M 256 82 C 242 116, 229 140, 222 162 L 232 204 L 280 204 L 290 162 C 283 140, 270 116, 256 82 Z"
      fill="#F7F5ED"
      stroke="#F7F5ED"
      stroke-width="18"
      stroke-linejoin="round"
    />
    <rect x="225" y="212" width="62" height="15" rx="7.5" fill="#F7F5ED" stroke="#F7F5ED" stroke-width="16" />
    <path
      d="M 232 236 L 280 236 L 269 354 L 243 354 Z"
      fill="#F7F5ED"
      stroke="#F7F5ED"
      stroke-width="18"
      stroke-linejoin="round"
    />

    <!-- Plumín clásico (#203B5B) -->
    <path
      d="M 256 82 C 242 116, 229 140, 222 162 L 232 204 L 280 204 L 290 162 C 283 140, 270 116, 256 82 Z"
      fill="#203B5B"
    />
    <!-- Hendidura y orificio respiradero del plumín -->
    <line
      x1="256"
      y1="88"
      x2="256"
      y2="156"
      stroke="#F7F5ED"
      stroke-width="5.5"
      stroke-linecap="round"
    />
    <circle cx="256" cy="161" r="8" fill="#F7F5ED" />

    <!-- Anillo del cuello de la pluma -->
    <rect x="226" y="213" width="60" height="13" rx="6.5" fill="#203B5B" />

    <!-- Cuerpo estilizado de la pluma -->
    <path
      d="M 232 236 L 280 236 L 268 352 Q 256 358 244 352 Z"
      fill="#203B5B"
    />
  </g>

  <!-- Pequeño remate limpio en el nacimiento del lomo del libro -->
  <circle cx="256" cy="382" r="5" fill="#203B5B" />

  <!-- Tres pequeñas estrellas de cuatro puntas distribuidas delicadamente alrededor de la pluma -->
  <!-- Estrella 1 (superior izquierda) -->
  <path
    d="M 176 144 Q 176 160 192 160 Q 176 160 176 176 Q 176 160 160 160 Q 176 160 176 144 Z"
    fill="#203B5B"
  />
  <!-- Estrella 2 (media izquierda, más pequeña) -->
  <path
    d="M 142 222 Q 142 232 152 232 Q 142 232 142 242 Q 142 232 132 232 Q 142 232 142 222 Z"
    fill="#71899D"
  />
  <!-- Estrella 3 (derecha de la pluma) -->
  <path
    d="M 378 190 Q 378 203 391 203 Q 378 203 378 216 Q 378 203 365 203 Q 378 203 378 190 Z"
    fill="#203B5B"
  />
</svg>
